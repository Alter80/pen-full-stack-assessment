services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms
      POSTGRES_DB: sms
    ports:
      # Host port 5433, not 5432: avoids colliding with any native Postgres
      # install/service already running on the host machine.
      - "5433:5432"
    volumes:
      - sms_db_data:/var/lib/postgresql/data

volumes:
  sms_db_data:
